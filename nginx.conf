server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Grosse Videos: Range-Requests (Spulen) funktionieren mit nginx direkt
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Diese Dateien duerfen nie veraltet aus dem HTTP-Cache kommen,
    # sonst bleibt ein Geraet auf altem Code haengen.
    location ~ ^/(sw\.js|version\.json|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # App-Dateien: kurz cachen, der Service Worker uebernimmt das Offline-Caching
    location ~* \.(js|css|svg|png|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Videoliste als JSON + Videos selbst
    location /videos/ {
        alias /videos/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache" always;
        add_header Accept-Ranges bytes always;
        types {
            video/mp4  mp4 m4v;
            video/webm webm;
            image/jpeg jpg jpeg;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
