<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Anja VR</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css?v=__APP_VERSION__">
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <!-- Update-Leiste -->
  <div id="update-bar" class="update-bar" hidden>
    <span class="material">system_update</span>
    <span id="update-text">Neue Version verfügbar</span>
    <button id="update-btn" class="pill pill-accent">Aktualisieren</button>
  </div>

  <!-- Startseite -->
  <main id="home" class="home">
    <header class="top">
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <h1>Anja</h1>
          <p class="sub">360°-Videos · auch offline</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="net" class="chip" title="Verbindung">online</span>
        <button id="up-btn" class="round accent" aria-label="Video hochladen" title="360°-Video hochladen" hidden><span class="material">upload</span></button>
        <input id="up-file" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-matroska,.mp4,.m4v,.webm,.mov,.mkv" multiple hidden>
        <button id="menu-btn" class="round" aria-label="Menü"><span class="material">more_vert</span></button>
      </div>
    </header>

    <section class="storage" id="storage" hidden>
      <div class="storage-row"><span>Offline gespeichert</span><span id="storage-text">–</span></div>
      <div class="bar"><div id="storage-bar"></div></div>
    </section>

    <section id="uploads" class="uploads" hidden></section>

    <section id="list" class="list" aria-live="polite">
      <div class="empty">Lade Videos…</div>
    </section>

    <footer class="foot">
      <span>Version <b id="ver">__APP_VERSION__</b></span>
    </footer>
  </main>

  <!-- Menü -->
  <div id="menu" class="sheet" hidden>
    <div class="sheet-card">
      <h2>Einstellungen</h2>
      <button class="sheet-item" id="m-check"><span class="material">refresh</span><div><b>Nach Updates suchen</b><small>Prüft, ob es eine neue Version gibt</small></div></button>
      <button class="sheet-item" id="m-repair"><span class="material">build</span><div><b>App reparieren</b><small>Leert den App-Cache und lädt alles neu. Offline-Videos bleiben.</small></div></button>
      <button class="sheet-item danger" id="m-wipe"><span class="material">delete_sweep</span><div><b>Alles zurücksetzen</b><small>Löscht auch alle offline gespeicherten Videos</small></div></button>
      <button class="pill wide" id="m-close">Schließen</button>
    </div>
  </div>

  <!-- Player -->
  <section id="player" class="player" hidden>
    <div id="stage" class="stage"></div>
    <div id="tap-hint" class="tap-hint">Ziehen zum Umschauen</div>
    <div class="p-top">
      <button id="p-back" class="round glass" aria-label="Zurück"><span class="material">arrow_back</span></button>
      <div id="p-title" class="p-title glass">Video</div>
      <div class="p-top-right">
        <button id="p-gyro" class="round glass" aria-label="Bewegungssensor"><span class="material">screen_rotation</span></button>
        <button id="p-fmt" class="round glass" aria-label="Videoformat" title="Videoformat (360°, 180°, 3D …)"><span class="material">language</span></button>
        <button id="p-key" class="round glass" aria-label="Greenscreen" title="Greenscreen / Durchsicht"><span class="material">layers</span></button>
        <span id="vr-slot"></span>
        <span id="ar-slot"></span>
      </div>
    </div>
    <div id="fmt-panel" class="key-panel glass" hidden>
      <div class="kp-head"><b>Videoformat</b><button id="fp-close" class="round" aria-label="Schließen"><span class="material">close</span></button></div>
      <label class="kp-row"><span>Projektion</span><select id="fp-kind" class="sel"></select></label>
      <label class="kp-row"><span>3D</span><select id="fp-stereo" class="sel"></select></label>
      <label class="kp-row" id="fp-swap-row"><span>Augen tauschen</span><input id="fp-swap" type="checkbox" class="sw"></label>
      <label class="kp-slider" id="fp-fov-row"><span>Blickwinkel <b id="fp-fov-val"></b></span><input id="fp-fov" type="range" min="40" max="240" step="1"></label>
      <div class="kp-foot"><button id="fp-save" class="pill pill-accent">Für alle speichern</button><button id="fp-auto" class="pill">Automatisch</button></div>
      <small id="fp-src" class="fp-src"></small>
    </div>

    <div id="key-panel" class="key-panel glass" hidden>
      <div class="kp-head"><b>Greenscreen</b><button id="kp-close" class="round" aria-label="Schließen"><span class="material">close</span></button></div>
      <label class="kp-row"><span>Hintergrund durchsichtig</span><input id="kp-on" type="checkbox" class="sw"></label>
      <label class="kp-row" id="kp-cam-row"><span>Handy-Kamera dahinter</span><input id="kp-cam" type="checkbox" class="sw"></label>
      <div class="kp-row"><span>Farbe</span>
        <span class="kp-color"><input id="kp-color" type="color" value="#00ff00">
        <button id="kp-pick" class="pill">Pipette</button><button id="kp-auto" class="pill pill-accent">Auto</button></span></div>
      <label class="kp-slider"><span>Farbton-Bereich <b id="kv-hue"></b></span><input id="kp-hue" type="range" min="4" max="70" step="1"></label>
      <label class="kp-slider"><span>Mindest-Sättigung <b id="kv-sat"></b></span><input id="kp-sat" type="range" min="0" max="0.3" step="0.005"></label>
      <label class="kp-slider"><span>Weiche Kante <b id="kv-soft"></b></span><input id="kp-soft" type="range" min="0" max="0.6" step="0.01"></label>
      <label class="kp-slider"><span>Kante schrumpfen <b id="kv-choke"></b></span><input id="kp-choke" type="range" min="0" max="6" step="0.5"></label>
      <label class="kp-slider"><span>Grünstich weg <b id="kv-spill"></b></span><input id="kp-spill" type="range" min="0" max="1" step="0.01"></label>
      <label class="kp-slider"><span>Helligkeit ab <b id="kv-lumMin"></b></span><input id="kp-lumMin" type="range" min="0" max="0.8" step="0.01"></label>
      <label class="kp-slider"><span>Helligkeit bis <b id="kv-lumMax"></b></span><input id="kp-lumMax" type="range" min="0.2" max="1" step="0.01"></label>
      <label class="kp-row"><span>Maske zeigen <small>(weiß = bleibt, schwarz = weg)</small></span><input id="kp-mask" type="checkbox" class="sw"></label>
      <div class="kp-foot"><button id="kp-reset" class="pill">Standard</button><button id="kp-save" class="pill">Für alle speichern</button></div>
      <small id="kp-hint" class="fp-src"></small>
    </div>

    <div class="p-bottom glass">
      <button id="p-play" class="round accent" aria-label="Abspielen"><span class="material">play_arrow</span></button>
      <span id="p-time" class="time">0:00</span>
      <input id="p-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Spulen">
      <span id="p-dur" class="time">0:00</span>
      <button id="p-mute" class="round" aria-label="Ton"><span class="material">volume_up</span></button>
      <button id="p-recenter" class="round" aria-label="Ausrichten"><span class="material">center_focus_strong</span></button>
    </div>
  </section>

  <!-- Knoepfe im Handy-Durchsicht-Modus (WebXR DOM-Overlay) -->
  <div id="xr-overlay" class="xr-overlay" hidden>
    <button id="xo-exit" class="pill xo-exit"><span class="material">close</span>Beenden</button>
    <div class="xo-bar glass">
      <button id="xo-back" class="round" aria-label="10 Sekunden zurück"><span class="material">fast_rewind</span></button>
      <button id="xo-play" class="round accent" aria-label="Abspielen/Pause"><span class="material">pause</span></button>
      <button id="xo-fwd" class="round" aria-label="10 Sekunden vor"><span class="material">fast_forward</span></button>
      <button id="xo-key" class="round" aria-label="Greenscreen an/aus"><span class="material">layers</span></button>
      <button id="xo-center" class="round" aria-label="Ausrichten"><span class="material">center_focus_strong</span></button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>window.ANJA_VERSION = "__APP_VERSION__";</script>
  <script type="module" src="/app.js?v=__APP_VERSION__"></script>
</body>
</html>
